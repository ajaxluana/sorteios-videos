<body>
  <p>Redirecionando para o vídeo…</p>
  <script>
    const videos = [
      'https://www.youtube.com/shorts/18B8v0Gky5w',
      'https://www.youtube.com/shorts/R-odd2Wq0yU',
      'https://www.youtube.com/shorts/j197ukayo1c',
      'https://www.youtube.com/shorts/ayJWbG_5h-Q',
      'https://www.youtube.com/shorts/h8SNuGTkMQw',
      'https://www.youtube.com/shorts/kl_LkyBS6xA',
      'https://www.youtube.com/shorts/m2s1xbK-cQw'
    ];
    const random = new Uint32Array(1);
    crypto.getRandomValues(random);
    const limit = Math.floor(4294967296 / videos.length) * videos.length;
    while (random[0] >= limit) crypto.getRandomValues(random);
    window.location.replace(videos[random[0] % videos.length]);
  </script>
